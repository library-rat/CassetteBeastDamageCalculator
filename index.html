<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casset Beast Damage Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body>
  <div class="row">
    <div class="col-md-6"> <!-- player1 -->
      <p class="title">Player 1</p>
      <div class="row">
        <div class="col-md-4"> <!-- Character1-->
          <div class="search-box">
            <div class="row">
              <input type="text" id="input-box-character1" placeholder="First Player " autocomplete="off">
            </div>
            <div class="result-box-character1">
              <ul></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6" id="character1-stat">
              <div class="character1-level">
                <label>Level :</label>
                <input type="number" value="1" min="1" max="200" data-stat="level">
              </div>
              <input type="number" value="0" data-stat="maxHP">
              <input type="number" value="0" data-stat="mAtk">
              <input type="number" value="0" data-stat="mDef">
              <input type="number" value="0" data-stat="rAtk">
              <input type="number" value="0" data-stat="rDef">
              <input type="number" value="0" data-stat="speed">
              <div class="signature">
                <label>Is signature ?</label>
                <input type="checkbox" value="0" data-stat="signature">
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4"> <!--Beast1 -->
          <div class="search-box">
            <div class="row">
              <input type="text" id="input-box-beast1" placeholder="First Beast " autocomplete="off">
            </div>
            <div class="result-box-beast1">
              <ul></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6" id="beast1-stat">
              <div class="beast1-grade">
                <label>Grade :</label>
                <input type="number" value="0" min="0" max="5" data-stat="grade">
              </div>
              <input type="text" data-stat="type" placeholder="type" style="text-transform: capitalize;">
              <div class="result-box-type">
                <ul></ul>
              </div>
              <input type="number" value="0" data-stat="maxHP">
              <input type="number" value="0" data-stat="mAtk">
              <input type="number" value="0" data-stat="mDef">
              <input type="number" value="0" data-stat="rAtk">
              <input type="number" value="0" data-stat="rDef">
              <input type="number" value="0" data-stat="speed">
            </div>
          </div>
        </div>

        <div class="col-md-4"> <!--total stat player 1 -->
          <div class="row">
            <div class="col-md-6" id="total1-stat">
              <input type="number" value="0" data-stat="maxHP">
              <input type="number" value="0" data-stat="mAtk">
              <input type="number" value="0" data-stat="mDef">
              <input type="number" value="0" data-stat="rAtk">
              <input type="number" value="0" data-stat="rDef">
              <input type="number" value="0" data-stat="speed">
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="col-md-6"> <!--player2-->
      <p class="title">Player 2</p>

      <div class="row">
        <div class="col-md-4"><!--Character2 -->
          <div class="search-box">
            <div class="row">
              <input type="text" id="input-box-character2" placeholder="Second Player " autocomplete="off">
            </div>
            <div class="result-box-character2">
              <ul></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6" id="character2-stat">
              <div class="character2-level">
                <label>Level :</label>
                <input type="number" value="1" min="1" max="200" data-stat="level">
              </div>
              <input type="number" value="0" data-stat="maxHP">
              <input type="number" value="0" data-stat="mAtk">
              <input type="number" value="0" data-stat="mDef">
              <input type="number" value="0" data-stat="rAtk">
              <input type="number" value="0" data-stat="rDef">
              <input type="number" value="0" data-stat="speed">
              <div class="signature">
                <label>Is signature ?</label>
                <input type="checkbox" value="0" data-stat="signature">
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4"><!--Beast2-->
          <div class="search-box">
            <div class="row">
              <input type="text" id="input-box-beast2" placeholder="Second Beast " autocomplete="off">
            </div>
            <div class="result-box-beast2">
              <ul></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6" id="beast2-stat">
              <div class="beast2-grade">
                <label>Grade :</label>
                <input type="number" value="0" min="0" max="5" data-stat="grade">
              </div>
              <input type="text" data-stat="type" placeholder="type" style="text-transform: capitalize;">
              <div class="result-box-type">
                <ul></ul>
              </div>
              <input type="number" value="0" data-stat="maxHP">
              <input type="number" value="0" data-stat="mAtk">
              <input type="number" value="0" data-stat="mDef">
              <input type="number" value="0" data-stat="rAtk">
              <input type="number" value="0" data-stat="rDef">
              <input type="number" value="0" data-stat="speed">
            </div>
          </div>
        </div>

        <div class="col-md-4"> <!--total stat player 2 -->
          <div class="row">
            <div class="col-md-6" id="total2-stat">
              <input type="number" value="0" data-stat="maxHP">
              <input type="number" value="0" data-stat="mAtk">
              <input type="number" value="0" data-stat="mDef">
              <input type="number" value="0" data-stat="rAtk">
              <input type="number" value="0" data-stat="rDef">
              <input type="number" value="0" data-stat="speed">
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6" id="input-attack">
      <p class="title">Attack</p>

      <div>
        <label>Power : </label>
        <input type="number" data-stat="power" value=0>
      </div>

      <input type="text" data-stat="type" placeholder="type" style="text-transform: capitalize;">
      <div class="result-box-type">
        <ul></ul>
      </div>

      <div>
        <label>Hit Number : </label>
        <input type="number" data-stat="hitNb" value=1 >
      </div>

      <div>
        <label>Attacking stat :</label>
        <select id="attack-stat">
          <option value="">-- Choose the stat used by attacking beast--</option>
          <option value="maxHP">Max HP</option>
          <option value="mAtk">M. Atk</option>
          <option value="mDef">M. Def</option>
          <option value="rAtk">R. Atk</option>
          <option value="rDef">R. Def</option>
          <option value="speed">Speed</option>
        </select>
      </div>

      <div>
        <label>Defensive stat :</label>
        <select id="defend-stat">
          <option value="">-- Choose the stat used by defendin beast--</option>
          <option value="maxHP">Max HP</option>
          <option value="mAtk">M. Atk</option>
          <option value="mDef">M. Def</option>
          <option value="rAtk">R. Atk</option>
          <option value="rDef">R. Def</option>
          <option value="speed">Speed</option>
        </select>
      </div>

    </div>
  </div>
  <script src="loadbeast.js"></script>
</body>

</html>
