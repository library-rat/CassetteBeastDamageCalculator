<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casset Beast Damage Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body>
  <div class="row">
    <div class="col-md-6"> <!-- player1 -->
      <p class="title">Player 1</p>
      <div class="row"> 
        <div class="col-md-6"> <!-- Character1-->
          <div class="search-box">
            <div class="row">
              <input type="text" id="input-box-character1" placeholder="First Player " autocomplete="off">
            </div>
            <div class="result-box-character1">
              <ul></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6" id="character1-stat"></div>
          </div>
        </div>

        <div class="col-md-6"> <!--Beast1 -->
          <div class="search-box">
            <div class="row">
              <input type="text" id="input-box-beast1" placeholder="First Beast " autocomplete="off">
            </div>
            <div class="result-box-beast1">
              <ul></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6" id="beast1-stat"></div>
          </div>
        </div>

        <div class="col-md-6"> <!--total stat player 1 -->
          <div class="search-box">
            <!-- <div class="row">
              <input type="text" id="input-box-total1" placeholder="First Total" autocomplete="off">
            </div> -->
            <div class="result-box-total1">
              <ul></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6" id="total1-stat"></div>
          </div>
        </div>

      </div>
    </div>

    <div class="col-md-6"> <!--player2-->
      <p class="title">Player 2</p>

      <div class="row">
        <div class="col-md-6"><!--Character2 -->
          <div class="search-box">
            <div class="row">
              <input type="text" id="input-box-character2" placeholder="Second Player " autocomplete="off">
            </div>
            <div class="result-box-character2">
              <ul></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6" id="character2-stat"></div>
          </div>
        </div>

        <div class="col-md-6"><!--Beast2-->
          <div class="search-box">
            <div class="row">
              <input type="text" id="input-box-beast2" placeholder="Second Beast " autocomplete="off">
            </div>
            <div class="result-box-beast2">
              <ul></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6" id="beast2-stat"></div>
          </div>
        </div>

        <div class="col-md-6"> <!--total stat player 2 -->
          <div class="search-box">
            <!-- <div class="row">
              <input type="text" id="input-box-total2" placeholder="Second Total" autocomplete="off">
            </div> -->
            <div class="result-box-total2">
              <ul></ul>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6" id="total2-stat"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="loadbeast.js"></script>
</body>

</html>
